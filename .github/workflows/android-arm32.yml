name: Build Kodi Android (armeabi-v7a)

on:
  push:
    branches:
      - fork

permissions:
  contents: write

env:
  ANDROID_API: "21"
  ANDROID_ABI: "armeabi-v7a"
  NDK_VERSION: "25.2.9519653"

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      # ─────────────────────────────
      # CHECKOUT
      # ─────────────────────────────
      - name: Checkout Kodi
        uses: actions/checkout@v4
        with:
          repository: beeblebroxian/kodi
          ref: fork
          path: kodi-source
          fetch-depth: 1

      # ─────────────────────────────
      # SYSTEM DEPENDENCIES
      # ─────────────────────────────
      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y \
            git curl unzip zip build-essential \
            openjdk-17-jdk python3 cmake ninja-build

      # ─────────────────────────────
      # ANDROID SDK + NDK (FIXED)
      # ─────────────────────────────
      - name: Setup Android SDK/NDK
        run: |
          set -e

          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk

          # CMDLINE TOOLS (CORRECT ZIP)
          curl -L --fail -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          mkdir -p cmdline-tools
          unzip -q cmdline-tools.zip -d cmdline-tools

          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/

          export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH

          # ACCEPT LICENSES
          yes | sdkmanager --licenses

          # INSTALL SDK COMPONENTS
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK=$HOME/android-sdk/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      # ─────────────────────────────
      # KODI DEPENDS
      # ─────────────────────────────
      - name: Build depends (Android)
        run: |
          cd kodi-source/tools/depends

          ./bootstrap

          ./configure \
            --host=arm-linux-androideabi \
            --with-sdk-path=$ANDROID_HOME \
            --with-ndk-path=$ANDROID_NDK

          make -j$(nproc)

      # ─────────────────────────────
      # CMAKE CONFIG
      # ─────────────────────────────
      - name: Configure Kodi
        run: |
          mkdir -p build

          cmake -S kodi-source -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${ANDROID_ABI} \
            -DANDROID_PLATFORM=${ANDROID_API} \
            -DAPP_RENDER_SYSTEM=gles \
            -DCMAKE_BUILD_TYPE=Release

      # ─────────────────────────────
      # BUILD
      # ─────────────────────────────
      - name: Build
        run: |
          cmake --build build -j$(nproc)

      # ─────────────────────────────
      # COLLECT APK
      # ─────────────────────────────
      - name: Collect APK
        run: |
          mkdir -p output
          find build -name "*.apk" -exec cp {} output/ \; || true
          ls -R output

      # ─────────────────────────────
      # ARTIFACT
      # ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kodi-android-armeabi-v7a
          path: output/*.apk
